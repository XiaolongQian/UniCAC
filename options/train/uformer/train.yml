name: release_uformer
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 1234

# dataset and data loader settings
datasets:
  train:
    name: BenchCAC
    type: PairedImageDataset
    dataroot_gt: datasets/CACBench_Data/train/gt
    dataroot_lq: datasets/CACBench_Data/train/ab
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 256
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: BenchCAC
    type: PairedImageDataset
    dataroot_gt: datasets/CACBench_Data/val/gt
    dataroot_lq: datasets/CACBench_Data/val/ab
    io_backend:
      type: disk

# network structures
network_g:
  type: Uformer
  in_chans: 3
  img_size: 256
  embed_dim: 32
  win_size: 8
  token_projection: 'linear'
  token_mlp: 'leff'
  depths: [1, 2, 8, 8, 2, 8, 8, 2, 1]
  # depths: [2, 2, 2, 2, 2, 2, 2, 2, 2]
  modulators: true
  dd_in: 3

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: !!float 2e-2
    betas: [0.9, 0.999]

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 200000
    eta_min: !!float 1e-6

  total_iter: 200000
  warmup_iter: -1 # no warm up

  # losses
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 1e4
  save_img: true

  grids: true
  crop_size: 256
  max_minibatch: 8


  pbar: true

  metrics:
    score: # metric name, can be arbitrary
      type: calculate_score
      crop_border: 0
      test_y_channel: false
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
    lpips: # metric name, can be arbitrary
      type: calculate_lpips
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~
