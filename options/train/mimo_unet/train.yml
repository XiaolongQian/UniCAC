name: release_mimo_unet
model_type: MIMOUnet_Model
scale: 1
num_gpu: 1
manual_seed: 0
datasets:
  train:
    name: BenchCAC
    type: PairedImageDataset
    dataroot_gt: datasets/CACBench_Data/train/gt
    dataroot_lq: datasets/CACBench_Data/train/ab

    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 256
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: BenchCAC
    type: PairedImageDataset
    dataroot_gt: datasets/CACBench_Data/val/gt
    dataroot_lq: datasets/CACBench_Data/val/ab

    io_backend:
      type: disk

# network structures
network_g:
  type: MIMOUNetPlus

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.999]

  scheduler:
    type: MultiStepLR
    milestones: [40000, 80000, 110000, 140000, 170000]
    gamma: 0.5

  total_iter: 200000
  warmup_iter: -1 # no warm up

  # losses
  pixel_opt:
    type: MSELoss
    loss_weight: 1.0
    reduction: mean
#    toY: true
  pixel_opt2:
    type: fft_l1loss
    loss_weight: 0.1
    reduction: mean

# validation settings
val:
  val_freq: !!float 1e4
  save_img: true
  # grids: true
  # crop_size: 256
  # max_minibatch: 8
  pbar: true
  metrics:
    score: # metric name, can be arbitrary
      type: calculate_score
      crop_border: 0
      test_y_channel: false
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

    ssim: # metric name, can be arbitrary
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

    lpips: # metric name, can be arbitrary
      type: calculate_lpips
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500