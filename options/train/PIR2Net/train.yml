name: release_PIR2Net
model_type: PIR2Net_Model
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: BenchCAC
    type: PairedImage_PSF_FWHM_Dataset
    dataroot_gt: datasets/CACBench_Data/train/gt
    dataroot_lq: datasets/CACBench_Data/train/ab
    fov_map_path: datasets/fov_map_1280_1920.npy
    psf_path: datasets/CACBench_Lib/Train_Lib/psf
    txt_path: datasets/CACBench_Data/train/label

    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 256
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: BenchCAC
    type: PairedImage_PSF_FWHM_Dataset

    dataroot_gt: datasets/CACBench_Data/val/gt
    dataroot_lq: datasets/CACBench_Data/val/ab
    fov_map_path: datasets/fov_map_1280_1920.npy
    psf_path: datasets/CACBench_Lib/Val_Lib/psf
    txt_path: datasets/CACBench_Data/val/label
    io_backend:
      type: disk

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 200000
    eta_min: !!float 1e-7

  total_iter: 200000
  warmup_iter: -1 # no warm up

  # losses
  pixel_opt:
    type: FuseLoss
    loss_weight: 0.5
    reduction: mean

# validation settings
val:
  val_freq: !!float 1e4
  save_img: false
  grids: false

  pbar: true

  metrics:
    score: # metric name, can be arbitrary
      type: calculate_score
      crop_border: 0
      test_y_channel: false
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

    lpips: # metric name, can be arbitrary
      type: calculate_lpips
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
