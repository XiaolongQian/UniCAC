name: release_fovkpn
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 0
datasets:
  train:
    name: BenchCAC
    type: PairedImage_FOV_Dataset
    dataroot_gt: datasets/CACBench_Data/train/gt
    dataroot_lq: datasets/CACBench_Data/train/ab
    filename_tmpl: '{}'

    io_backend:
      type: disk

    gt_size: 128
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
  val:
    name: BenchCAC
    type: PairedImage_FOV_Dataset
    dataroot_gt: datasets/CACBench_Data/val/gt
    dataroot_lq: datasets/CACBench_Data/val/ab

    io_backend:
      type: disk

# network structures
network_g:
  type: FOVKPN
  input_channel: 5
  output_channel: 3
  n_channel: 32
  offset_channel: 32

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [40000, 80000, 110000, 140000, 170000]
    gamma: 0.5

  total_iter: 200000
  warmup_iter: -1 # no warm up

  # losses
  pixel_opt:
    type: MSELoss
    loss_weight: 0.1
    reduction: mean
#    toY: true
  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'conv5_4': 1  # before relu
    vgg_type: vgg19
    use_input_norm: true
    range_norm: false
    perceptual_weight: 1.0
    style_weight: 0
    criterion: l1

# validation settings
val:
  val_freq: !!float 1e4
  save_img: true
  # grids: true
  # crop_size: 256
  # max_minibatch: 8
  pbar: true
  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

    ssim: # metric name, can be arbitrary
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

    lpips: # metric name, can be arbitrary
      type: calculate_lpips
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500