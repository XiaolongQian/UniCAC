# network structures
network_g:
  type: PART
  # type: SwinIR_psfmap
  upscale: 1
  in_chans: 3
  img_size: 64
  window_size: 8
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  # shuffle: True
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  # num_heads: [3, 3, 3, 3, 3, 3]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# path
path:
  # pretrain_network_g: /home/qxl/Benchmark/BasicSR/experiments/Benchmark-PART/models/net_g_200000.pth
  pretrain_network_g: ../huggingface/PART/PART.pth
  strict_load_g: true
  param_key_g: params

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name

  pbar: true
  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

    ssim: # metric name, can be arbitrary
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

    lpips: # metric name, can be arbitrary
      type: calculate_lpips
      crop_border: 0
      test_y_channel: false
