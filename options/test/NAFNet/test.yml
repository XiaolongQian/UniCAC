# network structures
network_g:
  type: NAFNetLocal
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]

path:
  pretrain_network_g: ../huggingface/NAFNet/NAFNet.pth
  strict_load_g: true
  param_key_g: params
  resume_state: null
val:
  val_freq: 10000.0
  save_img: true
  pbar: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
    lpips:
      type: calculate_lpips
      crop_border: 0
      test_y_channel: false
  suffix: null
logger:
  print_freq: 200
  save_checkpoint_freq: 10000.0
  use_tb_logger: true
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: nccl
  port: 29500
inference_source: options/test/BenchCAC/PART/test_bench_part.yml (25 shared groups);
  existing method-specific grids settings retained
